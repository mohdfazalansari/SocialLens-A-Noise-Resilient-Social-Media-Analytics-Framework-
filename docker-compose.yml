version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: sociallens-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: social_analytics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sociallens-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEVICE=cpu
    volumes:
      - ./ai-service:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sociallens-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/social_analytics_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sociallens-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:

